name: Baseline Browser Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: portfolio-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture setup, syntax, packaging and browser diagnostics
        run: node .github/scripts/run-checks.mjs
      - name: Read validation result
        id: validation
        if: always()
        shell: bash
        run: |
          node -e "const r=require('./.ci-results/result.json'); process.stdout.write('passed='+(r.status===0)+'\n')" >> "$GITHUB_OUTPUT"
      - name: Preserve validated public site for deployment
        if: steps.validation.outputs.passed == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-${{ github.event.pull_request.head.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Publish or update the single PR diagnostic
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/report-ci.mjs
      - name: Preserve complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-diagnostics
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail normally after diagnostic publication
        if: always()
        run: node .github/scripts/enforce-result.mjs
