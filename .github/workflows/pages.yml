name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture setup, syntax, packaging and browser diagnostics
        run: node .github/scripts/run-checks.mjs
      - name: Publish or update the single PR diagnostic
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/report-ci.mjs
      - name: Preserve complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-diagnostics
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail normally after diagnostic publication
        if: always()
        run: node .github/scripts/enforce-result.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site package
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
