name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate exact validated PR artifact
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"

          pr_number="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' <<<"$prs")"
          head_sha="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty' <<<"$prs")"

          if [[ -z "$pr_number" || -z "$head_sha" ]]; then
            echo "No merged PR into main is associated with ${GITHUB_SHA}. Refusing to rebuild or rerun browser validation during Pages deployment." >&2
            exit 1
          fi

          artifact_name="portfolio-site-${head_sha}"
          artifacts="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"

          artifact_id="$(jq -r --arg sha "$head_sha" '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)][0].id // empty' <<<"$artifacts")"
          run_id="$(jq -r --arg sha "$head_sha" '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)][0].workflow_run.id // empty' <<<"$artifacts")"

          if [[ -z "$artifact_id" || -z "$run_id" ]]; then
            echo "PR #${pr_number} (${head_sha}) has no non-expired validated site artifact named ${artifact_name}. Refusing to rerun the expensive checks." >&2
            exit 1
          fi

          run="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          run_name="$(jq -r '.name // empty' <<<"$run")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$run")"

          if [[ "$run_name" != "Baseline Browser Proof" || "$conclusion" != "success" ]]; then
            echo "Validated site artifact came from run ${run_id}, but that run is '${run_name}' with conclusion '${conclusion}'. Refusing deployment." >&2
            exit 1
          fi

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "Reusing ${artifact_name} from successful PR #${pr_number} Browser Proof run ${run_id}."

      - name: Download exact validated public site
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.validated.outputs.artifact_name }}
          path: _site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validated.outputs.run_id }}

      - name: Verify downloaded package exists
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html || {
            echo "Validated artifact is missing _site/index.html." >&2
            exit 1
          }
          echo "Deploying the exact site already validated by PR #${{ steps.validated.outputs.pr_number }}."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload validated site package to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
