<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#0c1730"/>
      <stop offset="0.52" stop-color="#040815"/>
      <stop offset="1" stop-color="#000105"/>
    </radialGradient>
    <radialGradient id="cyanCloud" cx="30%" cy="45%" r="65%">
      <stop offset="0" stop-color="#2ec8ff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#1467c7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#07111e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetCloud" cx="70%" cy="35%" r="68%">
      <stop offset="0" stop-color="#c458ff" stop-opacity="0.38"/>
      <stop offset="0.46" stop-color="#4a218d" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7fbff" stop-opacity="0.95"/>
      <stop offset="0.08" stop-color="#7ddfff" stop-opacity="0.76"/>
      <stop offset="0.28" stop-color="#7a70ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0c1022" stop-opacity="0"/>
    </radialGradient>
    <filter id="nebula" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="4" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0.20 0    0    0 0.08
        0    0.34 0    0 0.12
        0    0    0.56 0 0.20
        0    0    0    0.72 0" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ringStroke" x1="0" x2="1">
      <stop offset="0" stop-color="#5bd9ff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#a888ff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#58d6ff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>
  <rect width="1600" height="900" filter="url(#nebula)" opacity="0.82"/>
  <ellipse cx="335" cy="405" rx="610" ry="380" fill="url(#cyanCloud)"/>
  <ellipse cx="1290" cy="330" rx="560" ry="390" fill="url(#violetCloud)"/>
  <ellipse cx="800" cy="468" rx="420" ry="265" fill="url(#coreGlow)" opacity="0.34"/>

  <g fill="none" stroke="url(#ringStroke)" filter="url(#glow)">
    <ellipse cx="800" cy="462" rx="265" ry="178" stroke-width="3" opacity="0.30"/>
    <ellipse cx="800" cy="462" rx="385" ry="248" stroke-width="2" opacity="0.22"/>
    <ellipse cx="800" cy="462" rx="520" ry="326" stroke-width="1.5" opacity="0.14"/>
  </g>

  <g fill="#dbeaff">
    <circle cx="132" cy="118" r="1.6"/><circle cx="246" cy="685" r="1.1"/><circle cx="417" cy="151" r="1.3"/>
    <circle cx="560" cy="741" r="1.5"/><circle cx="705" cy="108" r="1.0"/><circle cx="868" cy="171" r="1.8"/>
    <circle cx="1001" cy="714" r="1.1"/><circle cx="1163" cy="116" r="1.4"/><circle cx="1394" cy="628" r="1.7"/>
    <circle cx="1507" cy="222" r="1.0"/><circle cx="73" cy="478" r="1.2"/><circle cx="1261" cy="801" r="1.1"/>
  </g>

  <circle cx="1240" cy="244" r="82" fill="#17233f" opacity="0.62"/>
  <circle cx="1213" cy="216" r="18" fill="#7bcfff" opacity="0.13"/>
  <circle cx="306" cy="616" r="38" fill="#232b4e" opacity="0.54"/>
</svg>
